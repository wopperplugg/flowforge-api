global:
  resolve_timeout: 5m

route:
  receiver: local-webhook
  group_by:
    - alertname
    - service
    - severity
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: local-webhook
    webhook_configs:
      - url: http://host.docker.internal:5001/alerts
        send_resolved: true
