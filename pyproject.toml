[project]
name = "flowforge-api"
version = "0.1.0"
description = "Production-ready FastAPI backend для совместной работы с задачами"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=10.0.1",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "cryptography>=46.0.3",
    "email-validator>=2.3.0",
    "fastapi>=0.137.2",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.32",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.49.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic"]
skips = ["B101"]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8.0",
    "httpx>=0.28.1",
    "mypy>=1.18.0",
    "pip-audit>=2.8.0",
    "pre-commit>=4.3.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
pythonpath = ["."]
